name: 9oob-production

services:
  backend:
    image: 9oob-backend:${NOOB_RELEASE:-latest}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      DB_MODE: mongodb
      DB_URI: ${DB_URI:?Set DB_URI}
      NOOB_APP_ORIGIN: ${NOOB_APP_ORIGIN:?Set NOOB_APP_ORIGIN}
      NOOB_SERVER_API_KEY: ${NOOB_SERVER_API_KEY:?Set NOOB_SERVER_API_KEY}
      HEDERA_MIRROR_TESTNET_URL: ${HEDERA_MIRROR_TESTNET_URL:-https://testnet.mirrornode.hedera.com}
      NOOB_HEDERA_EVM_RPC_URL: ${NOOB_HEDERA_EVM_RPC_URL:-https://testnet.hashio.io/api}
      NOOB_BASE_RPC_URL: ${NOOB_BASE_RPC_URL:-https://sepolia.base.org}
      NOOB_HEDERA_BRIDGE_ADDRESS: ${NOOB_HEDERA_BRIDGE_ADDRESS:?Set NOOB_HEDERA_BRIDGE_ADDRESS}
      NOOB_BASE_BRIDGE_ADDRESS: ${NOOB_BASE_BRIDGE_ADDRESS:?Set NOOB_BASE_BRIDGE_ADDRESS}
      NOOB_SERVER_HOST: 0.0.0.0
      NOOB_SERVER_PORT: 3001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      storage:
      edge:
        aliases: [9oob-backend]
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: administrator
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongodb-data:/data/db
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/9oob.js:ro
    networks:
      - storage
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  storage:
    internal: true
  edge:
    name: 9oob-edge

volumes:
  mongodb-data:
